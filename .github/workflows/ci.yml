name: Build and Test
on: [push, pull_request]

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'
        
    - name: Build
      run: |
        # Ищем файлы .slnx вместо .sln
        for f in $(find . -name "*.slnx"); do
          if [[ "$f" != *"CalculatorOnForms2"* ]]; then
            dotnet build "$f"
          fi
        done

    - name: Run tests
      run: |
        for f in $(find . -name "*.slnx"); do
          if [[ "$f" != *"CalculatorOnForms2"* ]]; then
            dotnet test "$f"
          fi
        done

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Build and Test
      shell: pwsh
      run: |
        # Обновляем фильтр на *.slnx
        Get-ChildItem -Recurse -Filter *.slnx | ForEach-Object {
          dotnet build $_.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test $_.FullName --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
